<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <style>
    /* ===== 暗色主题 ===== */
    :root {
      --bg: #0d1117;
      --bg-secondary: #161b22;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --border: #30363d;
      --accent: #58a6ff;
      --link: #58a6ff;
      --code-bg: #161b22;
      --blockquote: #161b22;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.6;
      font-size: 16px;
    }
    .wrapper {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }
    header, footer {
      border: 1px solid var(--border);
      padding: 1rem 1.5rem;
      border-radius: 6px;
      margin-bottom: 1.5rem;
      background: var(--bg-secondary);
    }
    header h1, footer p { color: var(--text); }
    h1, h2, h3, h4 { color: #ffffff; margin: 1rem 0 0.5rem; }
    h1 { font-size: 1.8rem; }
    h2 { font-size: 1.4rem; border-bottom: 1px solid var(--border); padding-bottom: 0.3rem; }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    ul { list-style: none; padding-left: 1rem; }
    ul li::before { content: "•"; color: var(--accent); margin-right: 0.5rem; }
    li { margin: 0.3rem 0; }
    p { margin: 0.5rem 0; }
    blockquote {
      border-left: 4px solid var(--accent);
      background: var(--blockquote);
      padding: 0.5rem 1rem;
      border-radius: 0 6px 6px 0;
      margin: 1rem 0;
      color: var(--text-muted);
    }
    code {
      background: var(--code-bg);
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      font-size: 0.9em;
    }
    pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem;
      overflow-x: auto;
      margin: 1rem 0;
    }
    pre code { background: none; padding: 0; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 0.5rem 0.8rem;
      text-align: left;
    }
    th { background: var(--bg-secondary); color: #fff; }
    tr:nth-child(even) { background: var(--bg-secondary); }
    hr { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
    /* 文章列表 */
    .post-list li { margin: 0.8rem 0; }
    .post-list .date { color: var(--text-muted); margin-right: 0.5rem; }
    /* header 导航 */
    .site-title { font-size: 1.4rem; font-weight: bold; }
    .site-nav { margin-top: 0.5rem; }
    .site-nav a { margin-right: 1rem; color: var(--text-muted); }
    .site-nav a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrapper">
    <header>
      <div class="site-title">🌙 {{ site.title }}</div>
      <nav class="site-nav">
        <a href="/">首页</a>
        <a href="/posts/">文章</a>
      </nav>
    </header>

    <main>
      {{ content }}
    </main>

    <footer>
      <p>&copy; {{ site.time | date: "%Y" }} {{ site.author }}</p>
    </footer>
  </div>
</body>
</html>
