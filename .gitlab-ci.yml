variables:
  JEKYLL_ENV: production

pages:
  stage: deploy
  script:
    - bundle install
    - bundle exec jekyll build
    - rm -rf /data/blog/*
    - cp -r _site/. /data/blog/
    - echo "部署完成 → http://192.168.109.202:4000"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
