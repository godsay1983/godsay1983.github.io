title: 小帅猪的博客
author: 小帅猪
description: >
  这是一个用 Jekyll 创建的个人博客。
lang: zh-CN

# Jekyll 配置
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# 文章目录
future: true
show_drafts: false
highlighter: rouge

# 分页设置
paginate: 20
paginate_path: "/posts/page:num/"

# 搜索配置
search_full_index: true

# 时区
timezone: Asia/Shanghai

# Build settings
collections:
  posts:
    permalink: /posts/:year/:month/:day/:title/

# GitHub（用于 Gitalk 评论，需在 GitHub OAuth App 注册后填入）
github:
  client_id: "REMOVED_CLIENT_ID"
  client_secret: "REMOVED_CLIENT_SECRET"
  repository: "godsay1983/godsay1983.github.io"

# Gitalk 评论开关
# 默认关闭（内网 GitLab 部署不需要评论）。
# GitHub Pages 部署时由 CI 用 --config 叠加 _config_github.yml 开启。
gitalk_enabled: false
