title: 小帅猪的博客
author: 小帅猪
description: >
  这是一个用 Jekyll 创建的个人博客。
lang: zh-CN

# Jekyll 配置
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# 文章目录
future: true
show_drafts: false
highlighter: rouge

# 分页设置
paginate: 20
paginate_path: "/posts/page:num/"

# 搜索配置
search_full_index: true

# 时区
timezone: Asia/Shanghai

# Build settings
collections:
  posts:
    permalink: /posts/:year/:month/:day/:title/

# Gitalk 评论已移除（原 OAuth client_secret 曾以明文提交到公开仓库，已从代码删除）
# 如需重新启用评论，请改用服务端代理方案，勿将 client_secret 提交到仓库。

