<h2>最新文章</h2>

<ul class="post-list">
{% for post in site.posts limit:10 %}
  <li>
    <span class="date">{{ post.date | date: "%Y-%m-%d" }}</span>
    <a href="{{ post.url }}">{{ post.title }}</a>
  </li>
{% endfor %}
</ul>
