title: 小帅猪的博客
author: 小帅猪
description: >
  这是一个用 Jekyll 创建的个人博客。
lang: zh-CN

# Jekyll 配置
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# 文章目录
future: true
show_drafts: false
highlighter: rouge

# 分页设置
paginate: 20
paginate_path: "/posts/page:num/"

# 时区
timezone: Asia/Shanghai

# Build settings
collections:
  posts:
    permalink: /posts/:year/:month/:day/:title/
